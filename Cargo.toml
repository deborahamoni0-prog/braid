[workspace]
resolver = "2"
members = ["crates/braid-core", "crates/braid-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Soroban-Chron/braid"
rust-version = "1.75"

[workspace.dependencies]
syn = { version = "2.0", features = ["full", "visit", "extra-traits", "parsing", "printing"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
