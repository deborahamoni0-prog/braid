name: ci
on:
  push: { branches: [main] }
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: braid must not regress on its own fixtures
        run: |
          cargo build --release
          ./target/release/braid analyze fixtures/good_registry --fail-on info
          ./target/release/braid analyze fixtures/clean_token --fail-on warning
